/* Standalone page backed by Supabase. Layout: green scoreboard header band, centred content column; Group A and B tables side by side, group fixtures, then a left-to-right knockout tree (quarter-finals, semi-finals, final). Live data merged from version b249. */
:root{
  --bg:#f3f6f4;--card:#ffffff;--ink:#1c2b24;--muted:#5f6f67;--line:#dfe6e2;--soft:#f6f9f7;--row:#fcfdfc;
  --brand:#0f6b4a;--brand-fg:#ffffff;--accent-text:#0f6b4a;--danger:#d94a2b;--up:#7d8993;--live:#d94a2b;
  --win-bg:#effaf4;--conn:#b9c7bf;--gold:#f5b301;--gold-soft:#fff4cc;--gold-soft2:#ffe08a;
  --hd1:#0b4f38;--hd2:#0f6b4a;--m-bg:#e6eef9;--m-fg:#224466;--f-bg:#fbe7ef;--f-fg:#7a2146;
  --out-bg:#fde9e4;--out-fg:#a6321a;
  --warn-bg:#fff6e0;--warn-line:#f0d9a0;--input-bg:#ffffff;
  --font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1713;--card:#18231e;--ink:#e6efe9;--muted:#9db0a6;--line:#2b3a33;--soft:#1d2a24;--row:#16211c;
  --brand:#1f8a63;--accent-text:#5fd6a4;--danger:#ef6a4c;--up:#6f7d76;--live:#d9492c;
  --win-bg:#173326;--conn:#4a6256;--gold-soft:#3a3010;--gold-soft2:#4d3f0e;
  --hd1:#082a1f;--hd2:#0b4a35;--m-bg:#1e2d45;--m-fg:#b9d0f5;--f-bg:#43202f;--f-fg:#f5b9d0;
  --out-bg:#4a2219;--out-fg:#f5b4a4;
  --warn-bg:#2f2810;--warn-line:#5a4a1a;--input-bg:#101a15;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1713;--card:#18231e;--ink:#e6efe9;--muted:#9db0a6;--line:#2b3a33;--soft:#1d2a24;--row:#16211c;
  --brand:#1f8a63;--accent-text:#5fd6a4;--danger:#ef6a4c;--up:#6f7d76;--live:#d9492c;
  --win-bg:#173326;--conn:#4a6256;--gold-soft:#3a3010;--gold-soft2:#4d3f0e;
  --hd1:#082a1f;--hd2:#0b4a35;--m-bg:#1e2d45;--m-fg:#b9d0f5;--f-bg:#43202f;--f-fg:#f5b9d0;
  --out-bg:#4a2219;--out-fg:#f5b4a4;
  --warn-bg:#2f2810;--warn-line:#5a4a1a;--input-bg:#101a15;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);font-size:15px;line-height:1.45;background:var(--bg);color:var(--ink)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:linear-gradient(135deg,var(--hd1),var(--hd2));color:#fff;text-align:center;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.25);
  padding-top:calc(env(safe-area-inset-top,0px) + 8px);max-height:24vh;overflow:hidden}
header .brand{display:flex;align-items:center;justify-content:center;gap:10px}
header .bt{min-width:0;flex:0 1 auto}
header .logo{width:clamp(38px,7vh,56px);height:clamp(38px,7vh,56px);flex:none;border-radius:10px;object-fit:cover;border:2px solid rgba(255,255,255,.65);cursor:pointer;background:#0b1d3a}
header h1{margin:0;font-size:clamp(1rem,3.4vh,1.5rem);line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
header p{margin:2px 0 0;opacity:.95;font-size:.82rem;line-height:1.3}
header .pub{font-size:.72rem;opacity:.85;margin:1px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav{display:flex;justify-content:center;gap:4px;flex-wrap:wrap}
nav button{background:transparent;border:0;color:#cfe8dd;padding:7px 14px;font:inherit;font-size:.88rem;cursor:pointer;border-bottom:3px solid transparent}
nav button.active{color:#fff;border-color:#ffb199;font-weight:600}
main{padding-block:16px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;min-width:0}
.card h2{margin:0 0 12px;font-size:1.1rem}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>label{flex:1 1 180px;min-width:0;display:flex;flex-direction:column;font-size:.85rem;color:var(--muted);gap:4px}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--input-bg);color:var(--ink);min-width:0}
input[type=number]{width:100%}
button.btn{background:var(--brand);color:var(--brand-fg);border:0;padding:9px 16px;border-radius:8px;font:inherit;cursor:pointer}
button.btn.alt{background:var(--card);color:var(--accent-text);border:1px solid var(--accent-text)}
button.btn.danger{background:var(--danger);color:#fff}
button.btn.dangeralt{background:var(--card);color:var(--danger);border:1px solid var(--danger)}
button.btn[disabled]{opacity:.6;cursor:default}
.actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
td.l,th.l{text-align:left}
tr.out td{opacity:.55}
tr.out td:last-child{opacity:1}
.qb{font-size:.68rem;padding:2px 8px;border-radius:99px;white-space:nowrap;font-weight:600}
.qb.q{background:var(--win-bg);color:var(--accent-text)}
.qb.o{background:var(--out-bg);color:var(--out-fg)}
.grp2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:16px;margin-bottom:16px}
.grp2 .card{margin-bottom:0}
.gblock+.gblock{margin-top:18px;padding-top:8px;border-top:1px solid var(--line)}
.gh{margin:6px 0 10px;font-size:1rem}
.round{margin-bottom:14px}
.round h3{margin:0 0 8px;font-size:.9rem;color:var(--accent-text)}
.match{display:grid;grid-template-columns:1fr auto 1fr auto;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--row)}
.match .t{font-weight:500;min-width:0}
.match .t.win{font-weight:700;color:var(--accent-text)}
.score{font-weight:700;font-size:1.1rem;min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
.badge{font-size:.72rem;padding:3px 9px;border-radius:99px;color:#fff;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.badge.Upcoming{background:var(--up)}.badge.Live{background:var(--live);animation:p 1.4s infinite}.badge.Completed{background:var(--brand)}
@keyframes p{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.badge.Live{animation:none}}
.teamgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:12px}
.team{border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.team h3{margin:0 0 8px;font-size:1rem}
.team ul{list-style:none;margin:0;padding:0}
.team li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:.92rem}
.g{font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--m-bg);color:var(--m-fg);white-space:nowrap}
.g.F{background:var(--f-bg);color:var(--f-fg)}
.muted{color:var(--muted);font-size:.88rem}
.pin{max-width:320px;margin:30px auto;text-align:center}
.pin input{width:100%;text-align:center;letter-spacing:.4em;font-size:1.3rem;margin:10px 0}
.err{color:var(--danger);min-height:1.2em;font-size:.88rem}
.ok{color:var(--accent-text);min-height:1.2em;font-size:.88rem}
.edit-team{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.edit-team .tline{display:flex;gap:8px}
.edit-team .tline input{flex:1;min-width:0;font-weight:600}
.edit-team .pl{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;align-items:center;margin-top:8px}
.mrow{display:grid;grid-template-columns:1fr 54px 14px 54px 1fr 110px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.mrow>span{min-width:0}
.mrow input{padding:6px;text-align:center}
.mrow.locked{opacity:.5;background:var(--soft)}
.mrow.locked input,.mrow.locked select{cursor:not-allowed}
.unlock{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0 8px;border-bottom:1px solid var(--line)}
.unlock input{width:150px;text-align:center;letter-spacing:.3em}
.unlock .muted{flex:1 1 auto}
.unlock .btn{padding:6px 14px}
.flt{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.flt button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 14px;cursor:pointer;font:inherit;font-size:.85rem}
.flt button.on{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.banner{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:8px;padding:8px 12px;margin-bottom:14px;font-size:.88rem}
.banner.mock{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pubbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:16px;background:var(--card)}
.pubbar.dirty{background:var(--warn-bg);border-color:var(--warn-line)}
.pubbar .txt{min-width:0}
.over{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;padding:10px 0 4px;margin-top:6px;border-top:1px solid var(--line)}
.over b{flex:1 1 100%;font-size:.88rem}
.over label{flex:1 1 200px;min-width:0;display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);gap:4px}
.evl{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;width:100%;text-align:left;background:var(--row);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font:inherit;color:var(--ink);cursor:pointer}
.evl b{color:var(--accent-text);text-decoration:underline}
.evl span{font-size:.85rem;color:var(--muted)}
/* knockout tree: columns are rounds, every match cell in a column shares the column height equally so each match sits level with the pair that feeds it */
.bracket-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:8px 4px 12px}
.shr{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.shr .box{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(360px,100%);max-height:100%;overflow:auto;text-align:center}
.shr h2{margin:0 0 4px;font-size:1.1rem}
.shr .qr{background:#fff;padding:10px;border-radius:10px;display:inline-block;margin:10px 0}
.shr .qr img{display:block;width:min(240px,64vw);height:auto;image-rendering:pixelated}
.shr .lnk{display:flex;gap:6px;margin:6px 0 10px}
.shr .lnk input{flex:1;min-width:0;font-size:.8rem}
.shr .actions{justify-content:center}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:center;gap:8px;background:var(--gold);color:#1c2b24;border:0;border-radius:99px;padding:12px 18px;font:inherit;font-weight:700;font-size:1rem;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35),0 0 0 3px rgba(255,255,255,.35);animation:fabp 2.4s ease-in-out 3}
.fab span{font-size:1.3rem;line-height:1}
.fab:hover{filter:brightness(1.05)}
@keyframes fabp{50%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){.fab{animation:none}}
main{padding-bottom:84px}
.swipe{display:none;text-align:center;font-size:.8rem;color:var(--muted);margin:0 0 6px}
.bo{font-weight:600;color:var(--accent-text)}
.tiecol small{color:var(--muted)}
.bracket{display:flex;align-items:stretch;gap:48px;width:max-content;margin:0 auto}
.rcol{display:flex;flex-direction:column}
.rcol h4{margin:0 0 10px;text-align:center;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mlist{flex:1;display:flex;flex-direction:column}
.m{flex:1;display:flex;align-items:center;position:relative;width:230px;min-height:124px}
.m .node{width:100%}
.rcol.has-next .m::after{content:'';position:absolute;left:100%;width:24px;border-right:2px solid var(--conn)}
.rcol.has-next .m:nth-child(odd)::after{top:50%;height:50%;border-top:2px solid var(--conn)}
.rcol.has-next .m:nth-child(even)::after{bottom:50%;height:50%;border-bottom:2px solid var(--conn)}
.rcol.has-prev .m::before{content:'';position:absolute;right:100%;top:50%;width:24px;border-top:2px solid var(--conn)}
.node{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--row)}
.node .nh{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 10px;font-size:.75rem;color:var(--muted);border-bottom:1px solid var(--line);background:var(--soft);border-radius:10px 10px 0 0}
.nrow{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;font-size:.92rem;gap:8px}
.nrow+.nrow{border-top:1px dashed var(--line)}
.nrow .nm{min-width:0;overflow-wrap:anywhere}
.nrow.win{background:var(--win-bg);font-weight:700;color:var(--accent-text)}
.nrow .tbd{color:var(--muted);font-weight:400}
.nrow b{min-width:18px;text-align:right;font-variant-numeric:tabular-nums}
.seed{font-size:.68rem;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-right:6px}
.nrow.win .seed{color:inherit}
.node.final{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.champ{margin:14px auto 0;text-align:center;background:linear-gradient(135deg,var(--gold-soft),var(--gold-soft2));border:1px solid var(--gold);border-radius:10px;padding:12px;font-weight:700;max-width:380px;color:var(--ink)}
.champ span{font-size:1.5rem}
.card.result{text-align:center;background:linear-gradient(135deg,var(--gold-soft),var(--gold-soft2));border-color:var(--gold);color:var(--ink)}
.card.result .muted{color:var(--ink);opacity:.75}
.card.result h2{font-size:1.5rem;margin:4px 0 10px}
.trophy{font-size:2.2rem;line-height:1}
ul.res{list-style:none;margin:0 auto;padding:0;max-width:440px;text-align:left;font-size:.92rem}
ul.res li{padding:4px 0;border-top:1px solid rgba(128,128,128,.25)}
@media(max-height:560px){header .pub{display:none}header{padding-top:calc(env(safe-area-inset-top,0px) + 4px)}nav button{padding:5px 12px}}
@media(max-width:640px){
  .m{width:212px;min-height:152px}
  .bracket{gap:44px}
  .swipe{display:block!important}
  .match{grid-template-columns:1fr auto 1fr}
  .match .badge{grid-column:1/-1;justify-self:center}
  .mrow{grid-template-columns:1fr 46px 10px 46px 1fr}
  .mrow select{grid-column:1/-1}
}

async function copyLink(){

  try{await navigator.clipboard.writeText(APP_LINK);m.textContent='Link copied.'}
  catch(e){const i=document.getElementById('shrUrl');i.focus();i.select();m.textContent='Press Ctrl+C (or long-press) to copy.'}
}
async function nativeShare(){try{await navigator.share({title:document.title,url:APP_LINK})}catch(e){}}

let dbErr='', evs=[], viewing=null;
async function fetchEvents(){
  try{
    const today=new Date().toLocaleDateString('en-CA');
    return (await sb('ttfix_events?select=id,name,location,event_date&is_mock=eq.false&event_date=lt.'+today+'&order=event_date.desc'))||[];
  }catch(e){return evs}
}
async function openEvent(id){
  try{
    const r=await sb('ttfix_events?id=eq.'+encodeURIComponent(id)+'&select=snapshot');
    if(r&&r[0]&&r[0].snapshot&&r[0].snapshot.teams){const sn=ensureEv(migrate(r[0].snapshot));sn.ko=sn.ko||{};viewing={snapshot:sn};tab='fixtures';render();window.scrollTo(0,0)}
  }catch(e){dbErr=dbMsg(e);render()}
}
function closeEvent(){viewing=null;render();window.scrollTo(0,0)}

function migrate(s){

async function fetchPub(){

/* ---------- Group round robin (circle method), one per group ---------- */
function rr(ids,g,out,limit){
  const a=ids.slice(); if(a.length%2)a.push(null);
  const n=a.length; let arr=a;
  const opp=ids.length-1, rounds=(limit>0&&limit<opp)?limit:n-1;
  for(let r=0;r<rounds;r++){
    for(let i=0;i<n/2;i++){
      const x=arr[i],y=arr[n-1-i];
      if(x!==null&&y!==null)out.push({id:g+'_'+r+'_'+i,group:g,round:r+1,a:x,b:y,sa:0,sb:0,status:'Upcoming'});
    }
    arr=[arr[0],arr[n-1],...arr.slice(1,n-1)];
  }
}
function generate(s){
  ensureGroups(s);

  GROUPS.forEach(g=>rr(s.teams.filter(t=>t.group===g).map(t=>t.id),g,out,s.limit||0));
  s.matches=out;s.ko={};
}
const team=id=>state.teams.find(t=>t.id===id)||{name:'?'};

function tally(teams){
  const rows=teams.map(t=>({t,g:t.group,p:0,w:0,l:0,pts:0,gf:0,ga:0}));
  const by=Object.fromEntries(rows.map(r=>[r.t.id,r]));
  state.matches.filter(x=>x.status==='Completed').forEach(x=>{
    const A=by[x.a],B=by[x.b];if(!A||!B)return;
    A.p++;B.p++;A.gf+=x.sa;A.ga+=x.sb;B.gf+=x.sb;B.ga+=x.sa;
    if(x.sa>x.sb){A.w++;B.l++;A.pts+=1}
    else if(x.sb>x.sa){B.w++;A.l++;B.pts+=1}
  });
  return rows.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||a.t.name.localeCompare(b.t.name));
}

    const ts=state.teams.filter(t=>t.group===g);
    return `<div class="card"><h2>Group ${g} · ${ts.length} teams</h2><div class="teamgrid">`+ts.map(t=>
      `<div class="team"><h3>${esc(t.name)}${champ&&champ.id===t.id?' 🏆':''}</h3><ul>`+
      t.players.map(p=>`<li><span>${esc(p.name)||'<span class="muted">— open slot —</span>'}</span><span class="g ${p.gender}">${p.gender==='M'?'Male':'Female'}</span></li>`).join('')+
      `</ul></div>`).join('')+`</div></div>`;
  }).join('');
}

/* ---------- Admin (edits the draft; changes save automatically) ---------- */
function planHint(){
  const p=plan(), el=draft.teams.length-p.Q;
  const where=p.Q===8?'quarter-finals':p.Q===4?'semi-finals':'final';
  return p.ok
    ?`Group A has ${p.ga} teams and Group B has ${p.gb}. The top ${p.Q} of all ${p.n} teams (both groups together) go to the ${where}; ${el} are eliminated.${draft.matches.length?' '+draft.matches.length+' group matches are scheduled.':''}`
    :`Group A has ${p.ga} teams and Group B has ${p.gb}. ${p.Q} teams would qualify, but the knockout needs 8, 4 or 2. Adjust the number of teams or eliminations.`;
}
/* Once any match has started, the setup and fixture controls need the admin PIN again */
function started(){return draft.matches.some(m=>m.status!=='Upcoming')||Object.values(draft.ko).some(k=>k&&k.status&&k.status!=='Upcoming')}
function lockBanner(){
  return `<div class="banner"><b>🔒 Matches have started.</b> These settings are locked.
    ${askSet
      ?`<div class="unlock"><input id="spin" type="password" inputmode="numeric" maxlength="8" aria-label="Admin PIN" placeholder="Admin PIN" onkeydown="if(event.key==='Enter')unlockSettings()"><button class="btn" onclick="unlockSettings()">Unlock</button><button class="btn alt" onclick="askSet=false;setErr='';render()">Cancel</button><span class="err">${esc(setErr)}</span></div>`
      :`<div class="unlock"><button class="btn alt" onclick="askSettings()">Enter PIN to edit</button></div>`}</div>`;
}
function askSettings(){askSet=true;setErr='';render();setTimeout(()=>{const i=$('#spin');if(i)i.focus()},0)}
async function unlockSettings(){
  const v=($('#spin')||{}).value||'';
  const r=await checkPin(v);
  if(r.ok){settingsOpen=true;askSet=false;setErr=''}
  else setErr=r.msg||BADPIN;
  render();
}
function viewAdmin(){
  if(!unlocked())return `<div class="card pin"><h2>Admin Console</h2><p class="muted">Enter your 8-digit PIN</p>
    <input id="pinIn" aria-label="Admin PIN" type="password" inputmode="numeric" maxlength="8" autocomplete="off" onkeydown="if(event.key==='Enter')tryPin()">
    <div class="err">${esc(adminMsg.pin||'')}</div>
    <button class="btn" onclick="tryPin()">Unlock</button></div>`;
  const m=adminMsg;
  let h='';

  const lockS=started()&&!settingsOpen, dS=lockS?'disabled':'';
  h+=`<div class="card"><h2>Tournament setup</h2>${lockS?lockBanner():''}<div class="row">
    <label>Tournament title *<input id="sTitle" value="${esc(draft.title)}" ${dS}></label>
    <label>Location *<input id="sLoc" value="${esc(draft.location)}" ${dS}></label>
    <label>Event date *<input id="sDate" type="date" value="${esc(draft.date||'')}" ${dS}></label></div>
    <div class="row" style="margin-top:12px">
    <label>Number of teams (2–32)<input id="sTeams" type="number" min="2" max="32" value="${draft.teamCount}" ${dS}></label>
    <label>Teams eliminated after the league<input id="sElim" type="number" min="0" max="31" value="${draft.elim}" ${dS}></label>
    <label>Matches per team in the group stage<input id="sLimit" type="number" min="0" max="31" value="${draft.limit||0}" ${dS}></label>
    <label>Male players per team<input id="sM" type="number" min="0" max="5" value="${draft.males}" ${dS}></label>
    <label>Female players per team<input id="sF" type="number" min="0" max="5" value="${draft.females}" ${dS}></label></div>
    <p class="muted">Maximum 5 players per team (males + females). Matches per team: 0 means everyone plays everyone in their group. A smaller number limits the group stage to that many rounds (in a group with an odd number of teams, a team with a bye plays one fewer).</p>
    <p class="muted">${esc(planHint())}</p>
    <div class="err" id="err-setup">${esc(m.setupErr||'')}</div><div class="ok">${esc(m.setupOk||'')}</div>
    <div class="actions"><button class="btn" onclick="applySetup()" ${dS}>Save setup</button><button class="btn alt" onclick="newEvent()" ${dS}>Start a new event</button></div></div>`;

  const lockG=draft.matches.length?'disabled':'';
  h+=`<div class="card"><h2>Team names, groups & players</h2>
    <p class="muted">${draft.matches.length?'Groups are locked while fixtures exist. Use "Clear fixtures" to change them.':'Teams 1 to '+Math.ceil(draft.teams.length/2)+' start in Group A and the rest in Group B. Change a team\'s group here before generating fixtures.'}</p>`+
    draft.teams.map((t,i)=>
    `<div class="edit-team"><div class="tline"><input data-tn="${i}" aria-label="Team ${i+1} name" value="${esc(t.name)}" placeholder="Team name">
    <select aria-label="Team ${i+1} group" ${lockG} onchange="setGroup(${i},this.value)">${GROUPS.map(g=>`<option value="${g}" ${t.group===g?'selected':''}>Group ${g}</option>`).join('')}</select></div>
    <div class="pl">`+t.players.map((p,j)=>`<span class="g ${p.gender}">${p.gender}</span><input data-tp="${i}_${j}" aria-label="Team ${i+1} player ${j+1}" value="${esc(p.name)}" placeholder="Player ${j+1} name">`).join('')+`</div></div>`).join('')+
    `<div class="ok">${esc(m.teamOk||'')}</div><div class="actions"><button class="btn" onclick="saveTeams()">Save teams</button></div></div>`;

  h+=`<div class="card"><h2>Fixtures</h2><p class="muted">Generates a round robin inside each group. ${draft.limit?`Each team plays up to ${draft.limit} matches in its group.`:'Every team plays the others in its group once.'} The top teams from each group then go into the knockout tree.</p>
    <div class="err" id="err-fix">${esc(m.fixErr||'')}</div>
    <div class="actions"><button class="btn ${draft.matches.length?'danger':''}" ${dS} onclick="doGenerate()">${draft.matches.length?'Regenerate fixtures (clears results)':'Generate fixtures'}</button>
    ${draft.matches.length?'<button class="btn dangeralt" '+dS+' onclick="doClear()">Clear fixtures</button>':''}</div></div>`;

  if(draft.matches.length){
    h+=`<div class="card"><h2>League match status & score</h2><p class="muted">Score = games won by each team (league matches are best of 3). Changes are saved automatically.</p>`+
    draft.matches.map(x=>matchRow('lg',x.id,`${x.group} R${x.round} · ${esc(team(x.a).name)}`,esc(team(x.b).name),x)).join('')+`</div>`;
  }

  const defs=koDefs();
  if(defs.length){
    h+=`<div class="card"><h2>Knockout matches</h2><p class="muted">Teams appear once all league matches are completed (quarter-finals are best of 3; semi-finals and the final are best of 5). If the automatic places are not right, use the drop-downs to choose the teams yourself. Changes are saved automatically.</p>`+
    defs.map(d=>{
      const x=koGet(d.id), A=koRef(d,'a'), B=koRef(d,'b');
      return overHtml(d)+matchRow('ko',d.id,`${d.title} · ${A?esc(A.name):koLabel(d.a)}`,B?esc(B.name):koLabel(d.b),x);
    }).join('')+`</div>`;
  }

  h+=pubBar();

  h+=`<div class="card"><h2>Change admin PIN</h2><div class="row">
    <label>Current PIN<input id="pOld" type="password" inputmode="numeric" maxlength="8"></label>
    <label>New PIN (8 digits)<input id="pNew" type="password" inputmode="numeric" maxlength="8"></label>
    <label>Confirm new PIN<input id="pNew2" type="password" inputmode="numeric" maxlength="8"></label></div>
    <p class="muted">The PIN is stored (hashed) in Supabase and a new PIN applies on every device straight away.</p>
    <div class="err" id="err-pin">${esc(m.pinErr||'')}</div><div class="ok">${esc(m.pinOk||'')}</div>
    <div class="actions"><button class="btn" onclick="changePin()">Update PIN</button>
    <button class="btn alt" onclick="lock()">Lock console</button>
    <button class="btn dangeralt" onclick="resetAll()">Reset all data</button></div></div>`;
  h+=`<div class="card" id="statsCard">${statsHtml()}</div>`;
  if(!statsTried)setTimeout(loadStats,0);
  return h;
}

/* Override of the teams in a first-round knockout match */
function overHtml(d){
  const sides=['a','b'].filter(s=>d[s].seed);
  if(!sides.length)return '';
  const cur=s=>(draft.ko[d.id]&&draft.ko[d.id]['t'+s])||'';
  const lk=koGet(d.id).status==='Completed'&&!openM[d.id]?'disabled':'';
  return `<div class="over"><b>${d.title}</b>`+sides.map(s=>{
    const other=cur(s==='a'?'b':'a');
    return `<label>Team ${s.toUpperCase()}<select aria-label="${d.title} team ${s.toUpperCase()}" ${lk} onchange="setKoTeam('${d.id}','${s}',this.value)"><option value="">Automatic (${koLabel(d[s])})</option>`+
      draft.teams.map(t=>`<option value="${t.id}" ${String(cur(s))===String(t.id)?'selected':''} ${other&&String(other)===String(t.id)?'disabled':''}>${esc(t.name)}</option>`).join('')+`</select></label>`;
  }).join('')+`</div>`;
}
function setKoTeam(id,side,v){
  const x=draft.ko[id]||(draft.ko[id]={sa:0,sb:0,status:'Upcoming'});
  x['t'+side]=v?Number(v):null;saveDraft();render();
}
/* A completed match is locked; the admin PIN is needed to edit it again. */
function matchRow(kind,id,left,right,x){
  const fn=kind==='ko'?'updKo':'upd';
  const mx=kind==='ko'?winsNeeded(koBest(id)):2;
  const locked=x.status==='Completed'&&!openM[id];
  const dis=locked?'disabled':'';
  let h=`<div class="mrow ${locked?'locked':''}"><span>${left}</span>
    <input type="number" min="0" max="${mx}" aria-label="Score" value="${x.sa}" ${dis} onchange="${fn}('${id}','sa',this.value)">
    <span>–</span>
    <input type="number" min="0" max="${mx}" aria-label="Score" value="${x.sb}" ${dis} onchange="${fn}('${id}','sb',this.value)">
    <span>${right}</span>
    <select aria-label="Status" ${dis} onchange="${fn}('${id}','status',this.value)">${['Upcoming','Live','Completed'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></div>`;
  if(locked){
    h+=askId===id
      ?`<div class="unlock"><input id="mpin" type="password" inputmode="numeric" maxlength="8" aria-label="Admin PIN" placeholder="Admin PIN" onkeydown="if(event.key==='Enter')unlockMatch('${id}')"><button class="btn" onclick="unlockMatch('${id}')">Unlock</button><button class="btn alt" onclick="askId=null;askErr='';render()">Cancel</button><span class="err">${esc(askErr)}</span></div>`
      :`<div class="unlock"><span class="muted">Completed and locked</span><button class="btn alt" onclick="askPin('${id}')">🔒 Edit</button></div>`;
  }
  return h;
}
function askPin(id){askId=id;askErr='';render();setTimeout(()=>{const i=$('#mpin');if(i)i.focus()},0)}
async function unlockMatch(id){
  const v=($('#mpin')||{}).value||'';
  const r=await checkPin(v);
  if(r.ok){openM[id]=true;askId=null;askErr=''}
  else askErr=r.msg||BADPIN;
  render();
}

/* ---------- Visitor analytics ---------- */
function vid(){
  try{let v=localStorage.getItem('ttfixture_vid');if(!v||v.length<8){v=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,12));localStorage.setItem('ttfixture_vid',v)}return v}
  catch(e){return 'tmp-'+Math.random().toString(36).slice(2,14)}
}
function logVisit(role){
  try{rpc('ttfix_log_visit',{p_visitor:vid(),p_role:role,p_pin:role==='admin'?apin():null}).catch(()=>{})}catch(e){}
}
let stats=null, statsErr='', statsBusy=false, statsTried=false;
async function loadStats(){
  statsTried=true;statsBusy=true;statsErr='';paintStats();
  try{stats=(await rpc('ttfix_visit_stats',{p_pin:apin(),p_days:60}))||[]}
  catch(e){stats=null;statsErr=(e.status===404||e.code==='PGRST202')?'Run the latest supabase-setup.sql to turn on visitor analytics.':(e.status===400?'The PIN was not accepted. Lock the console and enter it again.':dbMsg(e))}
  statsBusy=false;paintStats();
}
function paintStats(){const e=$('#statsCard');if(e)e.innerHTML=statsHtml()}
function statsHtml(){
  const head='<h2>Visitor analytics</h2><p class="muted">Opens = times the link was opened. Unique = different browsers or devices, counted per day (Singapore time). Last 60 days.</p>';
  const btn=`<div class="actions"><button class="btn alt" onclick="loadStats()" ${statsBusy?'disabled':''}>${statsBusy?'Loading…':'Refresh'}</button></div>`;
  if(statsErr)return head+`<div class="err">${esc(statsErr)}</div>`+btn;
  if(!stats)return head+'<p class="muted">Loading…</p>';
  const days={},tot={};
  stats.forEach(r=>{
    const o={o:+r.opens,u:+r.uniques};
    if(r.stat_day)(days[r.stat_day]=days[r.stat_day]||{})[r.stat_role]=o; else tot[r.stat_role]=o;
  });
  const c=(x)=>x?`<td>${x.o}</td><td>${x.u}</td>`:'<td>0</td><td>0</td>';
  const keys=Object.keys(days).sort().reverse().slice(0,30);
  if(!keys.length)return head+'<p class="muted">No visits recorded yet.</p>'+btn;
  return head+`<div class="scroll"><table><tr><th class="l" rowspan="2">Day</th><th colspan="2">Guest</th><th colspan="2">Admin</th><th colspan="2">All</th></tr><tr><th>Opens</th><th>Unique</th><th>Opens</th><th>Unique</th><th>Opens</th><th>Unique</th></tr>`+
    keys.map(k=>`<tr><td class="l" style="white-space:nowrap">${esc(new Date(k+'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short'}))}</td>${c(days[k].guest)}${c(days[k].admin)}${c(days[k].all)}</tr>`).join('')+
    `<tr><td class="l"><b>Total</b></td>${c(tot.guest)}${c(tot.admin)}${c(tot.all)}</tr></table></div>`+btn;
}
async function tryPin(){
  const v=$('#pinIn').value;
  if(!/^\d{8}$/.test(v)){adminMsg={pin:'Enter your 8-digit PIN.'};return render()}
  const r=await checkPin(v);
  if(r.ok){setApin(v);adminMsg={};logVisit('admin');render()}
  else{adminMsg={pin:r.msg||BADPIN};render()}
}
function lock(){setApin('');adminMsg={};settingsOpen=false;askSet=false;tab='fixtures';render()}

/* Messages written straight into the page keep whatever the admin has typed in the forms */
function say(id,text){const e=document.getElementById(id);if(e)e.textContent=text}
const _cf={};
function confirmTwice(key,errId,text){
  const now=Date.now();
  if(_cf[key]&&now-_cf[key]<8000){_cf[key]=0;return true}
  _cf[key]=now;say(errId,text);return false;
}

function applySetup(){
  const t=$('#sTitle').value.trim(), l=$('#sLoc').value.trim();
  const n=parseInt($('#sTeams').value), m=parseInt($('#sM').value), f=parseInt($('#sF').value), el=parseInt($('#sElim').value), lim=parseInt($('#sLimit').value)||0;
  if(!t||!l||!$('#sDate').value)return say('err-setup','Title, location and event date are required.');
  if(!(n>=2&&n<=32))return say('err-setup','Teams must be between 2 and 32.');
  if(!(m>=0&&f>=0)||m+f<1||m+f>5)return say('err-setup','Males + females per team must be between 1 and 5.');
  if(!(el>=0&&el<n))return say('err-setup','Eliminated teams must be between 0 and '+(n-1)+'.');
  if(!(lim>=0&&lim<=31))return say('err-setup','Matches per team must be between 0 and 31.');
  const changed=n!==draft.teamCount||m!==draft.males||f!==draft.females||lim!==(draft.limit||0);
  const elimChanged=el!==draft.elim;
  if(((changed&&draft.matches.length)||(elimChanged&&Object.keys(draft.ko).length))&&
     !confirmTwice('setup','err-setup','This clears existing fixtures or knockout results. Press Save setup again to confirm.'))return;
  draft.title=t;draft.location=l;draft.date=$('#sDate').value;draft.elim=el;draft.limit=lim;
  if(elimChanged)draft.ko={};
  if(changed){draft.teamCount=n;draft.males=m;draft.females=f;resizeTeams(draft);draft.matches=[];draft.ko={};draft.mock=false}
  settingsOpen=false;
  saveDraft();setMsg({setupOk:'Setup saved.'});
}
function newEvent(){
  if(!confirmTwice('newev','err-setup','This starts a blank event for guests. The current event stays saved and is listed under Events once its date has passed. Press "Start a new event" again to confirm.'))return;
  draft=blankState(null);openM={};settingsOpen=false;saveDraft();setMsg({setupOk:'New event started. Enter its title, location and date, then save setup.'});
}
function saveTeamsSilent(){
  document.querySelectorAll('[data-tn]').forEach(i=>{draft.teams[+i.dataset.tn].name=i.value.trim()||('Team '+(+i.dataset.tn+1))});
  document.querySelectorAll('[data-tp]').forEach(i=>{const [a,b]=i.dataset.tp.split('_');draft.teams[+a].players[+b].name=i.value.trim()});
  saveDraft();
}
function saveTeams(){saveTeamsSilent();setMsg({teamOk:'Teams saved.'})}
function setGroup(i,v){saveTeamsSilent();draft.teams[i].group=v;saveDraft();render()}
function doGenerate(){
  if(draft.matches.length&&!confirmTwice('gen','err-fix','Regenerating clears all results. Press the button again to confirm.'))return;
  saveTeamsSilent();generate(draft);draft.mock=false;saveDraft();setMsg({});
}
function doClear(){
  if(!confirmTwice('clr','err-fix','This deletes all fixtures and results. Press "Clear fixtures" again to confirm.'))return;
  draft.matches=[];draft.ko={};draft.mock=false;saveDraft();setMsg({});
}
function upd(id,k,v){
  const x=draft.matches.find(m=>m.id===id);if(!x)return;
  x[k]=(k==='status')?v:Math.min(2,Math.max(0,parseInt(v)||0));
  if(k==='status'&&v==='Completed')delete openM[id];
  saveDraft();render();
}
function updKo(id,k,v){
  const x=draft.ko[id]||(draft.ko[id]={sa:0,sb:0,status:'Upcoming'});
  x[k]=(k==='status')?v:Math.min(winsNeeded(koBest(id)),Math.max(0,parseInt(v)||0));
  if(k==='status'&&v==='Completed')delete openM[id];
  if(id==='final'&&k==='status'&&v==='Completed'&&!x.date)x.date=new Date().toLocaleDateString('en-CA');
  saveDraft();render();
}
async function changePin(){
  const o=$('#pOld').value,n=$('#pNew').value,c=$('#pNew2').value;
  if(!/^\d{8}$/.test(o))return say('err-pin','Enter your current 8-digit PIN.');
  if(!/^\d{8}$/.test(n))return say('err-pin','New PIN must be exactly 8 digits.');
  if(n!==c)return say('err-pin','New PINs do not match.');
  try{
    const ok=(await rpc('ttfix_change_pin',{p_old:o,p_new:n}))===true;
    if(!ok)return say('err-pin',BADPIN);
    setApin(n);setMsg({pinOk:'PIN updated. It applies on every device straight away.'});
  }catch(e){say('err-pin',dbMsg(e))}
}
function resetAll(){
  if(!confirmTwice('all','err-pin','This deletes the draft data in this browser (published fixtures are not touched). Press "Reset all data" again to confirm.'))return;
  draft=blankState(null);saveDraft();setMsg({});
}
function setMsg(o){adminMsg=o;render()}

/* ---------- Auto-publish: every saved change is written to ttfix_publications (PIN checked on the server) ---------- */
let pubTimer=null, pubAgain=false;
function autoPublish(){
  if(!unlocked()||!pub)return;
  clearTimeout(pubTimer);pubTimer=setTimeout(()=>{pubTimer=null;doPublish()},500);
  refreshPubBar();
}
async function doPublish(){
  if(publishing){pubAgain=true;return}
  publishing=true;refreshPubBar();
  try{
    const snap=clone(draft);delete snap.pinHash;
    const ts=await rpc('ttfix_publish',{p_pin:apin(),p_snapshot:snap});
    if(!ts)pubMsg={t:'The PIN was not accepted (it may have been changed, or locked after wrong tries). Lock the console and enter it again.',err:true};
    else{pub={snapshot:snap,publishedAt:ts};cachePub();pubMsg={t:'',err:false}}
  }catch(e){pubMsg={t:dbMsg(e),err:true}}
  finally{
    publishing=false;
    if(pubAgain){pubAgain=false;doPublish();return}
    refreshPubBar();
  }
}

/* ---------- Boot ---------- */
async function boot(){
  try{localStorage.removeItem(DKEY)}catch(e){}
  if(!$('#hTitle'))shell();
  dbErr='';render();
  await refreshPub(true);
  logVisit(unlocked()?'admin':'guest');
}
boot();
/* Guests pick up new publications without reloading */
setInterval(()=>{if(!document.hidden)refreshPub(false)},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshPub(false)});
</script>
